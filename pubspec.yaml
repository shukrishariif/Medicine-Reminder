name: daryeel
description: Offline-first medication reminders and daily wellness.
publish_to: 'none'
version: 2.0.0+1
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  intl: ^0.20.2
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  supabase_flutter: ^2.10.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.0.0
  timezone: ^0.10.1
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.2
  cupertino_icons: ^1.0.9
dev_dependencies:
  http: ^1.6.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/branding/

